[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nfl-helper"
version = "0.1.0"
description = "Fantasy football draft and weekly optimization manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "websockets>=12.0",
    "espn-api>=0.38.0",
    "pulp>=2.8.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0.0",
    "pandas>=2.2.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
nfl-helper = "nfl_helper.main:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
filterwarnings = [
    "error::ResourceWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".agent", "artifacts", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "SIM",
    "PERF",
]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B905"]
